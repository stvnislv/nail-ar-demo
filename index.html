<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Nail AR</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #c8d0d8 0%, #e8eef2 35%, #f4f6f8 50%, #1a1a1a 50.1%, #0d0d0d 100%);
      background-attachment: fixed;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px 16px;
    }
    .main-screen, .camera-screen {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .camera-screen { display: none; }
    h1 {
      font-size: 2.2rem;
      font-weight: 700;
      margin-bottom: 8px;
      text-shadow: 0 4px 20px rgba(0,0,0,.5);
      letter-spacing: -0.5px;
    }
    .subtitle {
      font-size: 1rem;
      color: rgba(255,255,255,.7);
      margin-bottom: 40px;
      text-align: center;
    }
    .glass-btn {
      padding: 16px 48px;
      font-size: 1.1rem;
      font-weight: 600;
      border: none;
      border-radius: 24px;
      background: rgba(255,255,255,.18);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      color: #fff;
      cursor: pointer;
      box-shadow: 0 10px 40px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.4), inset 0 -1px 0 rgba(0,0,0,.2);
      border: 1px solid rgba(255,255,255,.3);
      transition: all .25s ease;
      text-shadow: 0 1px 3px rgba(0,0,0,.4);
    }
    .glass-btn:hover, .glass-btn:active {
      background: rgba(255,255,255,.28);
      transform: translateY(-2px);
      box-shadow: 0 16px 50px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.5);
    }
    .glass-btn.secondary {
      background: rgba(255,255,255,.08);
      padding: 12px 28px;
      font-size: 0.95rem;
      font-weight: 500;
    }
    .status {
      margin: 12px 0;
      font-size: 0.85rem;
      color: rgba(255,255,255,.7);
      text-align: center;
      min-height: 1.2em;
    }
    .container {
      position: relative;
      width: 100%;
      aspect-ratio: 3/4;
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,.5), 0 0 0 1px rgba(255,255,255,.15);
      margin-bottom: 16px;
    }
    video, canvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
    }
    canvas { pointer-events: none; }
    .controls {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: center;
    }
    .color-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .color-btn {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      transition: transform .15s ease;
      box-shadow: 0 6px 20px rgba(0,0,0,.35), inset 0 2px 4px rgba(255,255,255,.4);
    }
    .color-btn.active, .color-btn:hover {
      transform: scale(1.15);
      box-shadow: 0 8px 28px rgba(0,0,0,.45), 0 0 0 3px rgba(255,255,255,.5);
    }
    .back-btn { margin-top: 8px; }
    .finish-row {
      display: flex;
      gap: 8px;
      margin-top: 4px;
    }
    .finish-btn {
      padding: 6px 14px;
      font-size: 0.8rem;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,.3);
      background: rgba(255,255,255,.1);
      color: #fff;
      cursor: pointer;
    }
    .finish-btn.active {
      background: rgba(255,255,255,.3);
    }
  </style>
</head>
<body>
  <div class="main-screen" id="mainScreen">
    <h1>Nail AR</h1>
    <div class="subtitle">Примерка цвета ногтей<br>в реальном времени</div>
    <button class="glass-btn" id="openCamera">Открыть камеру</button>
  </div>

  <div class="camera-screen" id="cameraScreen">
    <div class="status" id="status">Загрузка модели...</div>
    <div class="container">
      <video id="video" autoplay playsinline muted></video>
      <canvas id="canvas"></canvas>
    </div>
    <div class="controls">
      <button id="switchCam" class="glass-btn secondary">Переключить камеру</button>
      <div class="color-row">
        <div class="color-btn" style="background:#e91e63" data-color="#e91e63"></div>
        <div class="color-btn" style="background:#d32f2f" data-color="#d32f2f"></div>
        <div class="color-btn" style="background:#212121" data-color="#212121"></div>
        <div class="color-btn" style="background:#ffffff" data-color="#ffffff"></div>
        <div class="color-btn" style="background:#ffc107" data-color="#ffc107"></div>
        <div class="color-btn" style="background:#7b1fa2" data-color="#7b1fa2"></div>
      </div>
      <div class="finish-row">
        <button class="finish-btn active" data-finish="gloss">Глянец</button>
        <button class="finish-btn" data-finish="matte">Мат</button>
        <button class="finish-btn" data-finish="sheer">Полупрозрачный</button>
      </div>
      <button id="backBtn" class="glass-btn secondary back-btn">Назад</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>
  <script>
    const mainScreen = document.getElementById('mainScreen');
    const cameraScreen = document.getElementById('cameraScreen');
    const openCameraBtn = document.getElementById('openCamera');
    const backBtn = document.getElementById('backBtn');
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    const statusEl = document.getElementById('status');
    const switchBtn = document.getElementById('switchCam');
    const colorBtns = document.querySelectorAll('.color-btn');
    const finishBtns = document.querySelectorAll('.finish-btn');

    let currentColor = '#e91e63';
    let currentFinish = 'gloss';
    let session = null;
    let stream = null;
    let videoDevices = [];
    let useFront = false;
    let running = false;
    const MODEL_SIZE = 192;
    let prevMask = null;
    let frameCount = 0;
    const INFERENCE_EVERY = 3;

    let inputBuffer = new Float32Array(MODEL_SIZE * MODEL_SIZE * 3);
    let tmpCanvas = document.createElement('canvas');
    tmpCanvas.width = MODEL_SIZE;
    tmpCanvas.height = MODEL_SIZE;
    let tmpCtx = tmpCanvas.getContext('2d', { willReadFrequently: true });

    function setColor(color) {
      currentColor = color;
      colorBtns.forEach(b => b.classList.toggle('active', b.dataset.color === color));
    }
    colorBtns.forEach(btn => btn.addEventListener('click', () => setColor(btn.dataset.color)));
    setColor(currentColor);

    finishBtns.forEach(btn => btn.addEventListener('click', () => {
      currentFinish = btn.dataset.finish;
      finishBtns.forEach(b => b.classList.toggle('active', b === btn));
    }));

    function hexToRgb(hex) {
      return {
        r: parseInt(hex.slice(1,3),16),
        g: parseInt(hex.slice(3,5),16),
        b: parseInt(hex.slice(5,7),16)
      };
    }

    async function loadModel() {
      statusEl.textContent = 'Загрузка модели...';
      try {
        session = await ort.InferenceSession.create('./nail_unet.onnx', {
          executionProviders: ['wasm']
        });
        statusEl.textContent = 'Модель готова';
      } catch (e) {
        console.error(e);
        statusEl.textContent = 'Ошибка загрузки модели';
      }
    }

    async function getCameras() {
      try {
        const temp = await navigator.mediaDevices.getUserMedia({ video: true });
        temp.getTracks().forEach(t => t.stop());
        const devices = await navigator.mediaDevices.enumerateDevices();
        videoDevices = devices.filter(d => d.kind === 'videoinput');
      } catch (e) {}
    }

    function findDevice(preferFront) {
      if (!videoDevices.length) return null;
      const front = videoDevices.find(d => /front|user|face|лиц|selfie/i.test(d.label || ''));
      const rear = videoDevices.find(d => /back|rear|environment|задн|wide/i.test(d.label || ''));
      return preferFront ? (front || videoDevices[0]) : (rear || videoDevices[videoDevices.length - 1] || videoDevices[0]);
    }

    async function startCamera(preferFront = false) {
      statusEl.textContent = 'Запуск камеры...';
      useFront = preferFront;
      running = true;
      prevMask = null;

      try {
        if (stream) stream.getTracks().forEach(t => t.stop());
        if (!videoDevices.length) await getCameras();

        const device = findDevice(preferFront);
        const constraints = {
          video: {
            width: { ideal: 1280 },
            height: { ideal: 720 },
            facingMode: preferFront ? 'user' : 'environment'
          }
        };
        if (device && device.deviceId) constraints.video.deviceId = { exact: device.deviceId };

        stream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = stream;
        await video.play();

        statusEl.textContent = preferFront ? 'Передняя камера' : 'Задняя камера';
        processLoop();
      } catch (err) {
        statusEl.textContent = 'Ошибка камеры';
        running = false;
      }
    }

    function stopCamera() {
      running = false;
      if (stream) {
        stream.getTracks().forEach(t => t.stop());
        stream = null;
      }
      video.srcObject = null;
      prevMask = null;
    }

    async function processLoop() {
      if (!running || !session) return;
      if (video.readyState >= 2) {
        await segmentAndDraw();
      }
      requestAnimationFrame(processLoop);
    }

    function prepareInput() {
      const vw = video.videoWidth;
      const vh = video.videoHeight;
      const scale = Math.max(MODEL_SIZE / vw, MODEL_SIZE / vh);
      const sw = vw * scale;
      const sh = vh * scale;
      const sx = (sw - MODEL_SIZE) / 2;
      const sy = (sh - MODEL_SIZE) / 2;

      tmpCtx.drawImage(video, -sx / scale, -sy / scale, vw, vh);
      const imgData = tmpCtx.getImageData(0, 0, MODEL_SIZE, MODEL_SIZE);
      const data = imgData.data;

      for (let i = 0, p = 0; i < data.length; i += 4, p += 3) {
        inputBuffer[p]     = data[i]     / 255;
        inputBuffer[p + 1] = data[i + 1] / 255;
        inputBuffer[p + 2] = data[i + 2] / 255;
      }
      return inputBuffer;
    }

    function smoothMask(newMask) {
      if (!prevMask) {
        prevMask = new Float32Array(newMask);
        return prevMask;
      }
      const alpha = 0.35;
      for (let i = 0; i < newMask.length; i++) {
        prevMask[i] = prevMask[i] * (1 - alpha) + newMask[i] * alpha;
      }
      return prevMask;
    }

    function applyPolish(imageData, mask, w, h, rgb, finish) {
      const data = imageData.data;
      const scaleX = w / MODEL_SIZE;
      const scaleY = h / MODEL_SIZE;
      const THRESHOLD = 0.68;

      for (let y = 0; y < MODEL_SIZE; y++) {
        for (let x = 0; x < MODEL_SIZE; x++) {
          const m = mask[y * MODEL_SIZE + x];
          if (m < THRESHOLD) continue;

          const strength = Math.min(1, (m - THRESHOLD) / 0.25);
          const px = Math.floor(x * scaleX);
          const py = Math.floor(y * scaleY);

          for (let dy = 0; dy < Math.ceil(scaleY) && py + dy < h; dy++) {
            for (let dx = 0; dx < Math.ceil(scaleX) && px + dx < w; dx++) {
              const i = ((py + dy) * w + (px + dx)) * 4;
              const r = data[i], g = data[i+1], b = data[i+2];

              const lum = 0.299 * r + 0.587 * g + 0.114 * b;
              const highlight = Math.max(0, (lum - 170) / 85);

              let mix = strength;
              if (finish === 'sheer') mix *= 0.5;
              else if (finish === 'matte') mix *= 0.9;

              let nr = r * (1 - mix) + rgb.r * mix;
              let ng = g * (1 - mix) + rgb.g * mix;
              let nb = b * (1 - mix) + rgb.b * mix;

              if (finish === 'gloss' && highlight > 0.08) {
                const hStr = Math.min(0.65, highlight * strength * 0.85);
                nr = nr * (1 - hStr) + 255 * hStr;
                ng = ng * (1 - hStr) + 255 * hStr;
                nb = nb * (1 - hStr) + 255 * hStr;
              }
              if (finish === 'matte') {
                const shade = 0.92;
                nr *= shade; ng *= shade; nb *= shade;
              }

              data[i]   = Math.max(0, Math.min(255, nr));
              data[i+1] = Math.max(0, Math.min(255, ng));
              data[i+2] = Math.max(0, Math.min(255, nb));
            }
          }
        }
      }
    }

    async function segmentAndDraw() {
      const w = video.videoWidth;
      const h = video.videoHeight;
      if (!w || !h) return;

      canvas.width = w;
      canvas.height = h;

      frameCount++;
      let mask = prevMask;

      if (frameCount % INFERENCE_EVERY === 0 || !prevMask) {
        const input = prepareInput();
        const tensor = new ort.Tensor('float32', input, [1, MODEL_SIZE, MODEL_SIZE, 3]);
        const results = await session.run({ input: tensor });
        const rawMask = results[Object.keys(results)[0]].data;
        const filtered = new Float32Array(rawMask.length);
        let strong = 0;
        for (let i = 0; i < rawMask.length; i++) {
          if (rawMask[i] > 0.62) {
            filtered[i] = rawMask[i];
            strong++;
          }
        }
        if (strong > MODEL_SIZE * MODEL_SIZE * 0.15) {
          for (let i = 0; i < filtered.length; i++) {
            if (filtered[i] < 0.75) filtered[i] = 0;
          }
        }
        mask = smoothMask(filtered);
      }

      ctx.drawImage(video, 0, 0, w, h);
      const imageData = ctx.getImageData(0, 0, w, h);
      const rgb = hexToRgb(currentColor);
      applyPolish(imageData, mask, w, h, rgb, currentFinish);
      ctx.putImageData(imageData, 0, 0);
    }

    openCameraBtn.addEventListener('click', async () => {
      mainScreen.style.display = 'none';
      cameraScreen.style.display = 'flex';
      if (!session) await loadModel();
      startCamera(false);
    });

    backBtn.addEventListener('click', () => {
      stopCamera();
      cameraScreen.style.display = 'none';
      mainScreen.style.display = 'flex';
    });

    switchBtn.addEventListener('click', () => startCamera(!useFront));

    loadModel();
  </script>
</body>
</html>
