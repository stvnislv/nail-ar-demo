<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Nail AR — U-Net</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #0f0f0f; color: #eee; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 12px; }
    h1 { margin: 8px 0; font-size: 1.3rem; text-align: center; }
    .status { margin: 6px 0 12px; color: #aaa; font-size: 0.9rem; text-align: center; min-height: 1.2em; }
    .container { position: relative; width: 100%; max-width: 640px; aspect-ratio: 3/4; background: #000; border-radius: 16px; overflow: hidden; box-shadow: 0 8px 32px rgba(0,0,0,.6); }
    video, canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
    canvas { pointer-events: none; }
    .controls { margin-top: 16px; width: 100%; max-width: 640px; display: flex; flex-direction: column; gap: 12px; align-items: center; }
    .color-row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
    .color-btn { width: 48px; height: 48px; border-radius: 50%; border: 3px solid #fff; cursor: pointer; transition: transform .12s; }
    .color-btn:hover, .color-btn.active { transform: scale(1.15); }
    button { padding: 12px 24px; font-size: 1rem; border: none; border-radius: 12px; background: #e91e63; color: white; cursor: pointer; font-weight: 600; }
    button.secondary { background: #444; }
    .hint { font-size: 0.8rem; color: #888; text-align: center; margin-top: 8px; max-width: 500px; }
  </style>
</head>
<body>
  <h1>Nail AR — U-Net</h1>
  <div class="status" id="status">Загрузка модели...</div>
  <div class="container">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>
  </div>
  <div class="controls">
    <button id="start">Запустить камеру</button>
    <button id="switchCam" class="secondary" style="display:none;">Переключить камеру</button>
    <div class="color-row">
      <div class="color-btn" style="background:#e91e63" data-color="#e91e63"></div>
      <div class="color-btn" style="background:#d32f2f" data-color="#d32f2f"></div>
      <div class="color-btn" style="background:#212121" data-color="#212121"></div>
      <div class="color-btn" style="background:#ffffff" data-color="#ffffff"></div>
      <div class="color-btn" style="background:#ffc107" data-color="#ffc107"></div>
      <div class="color-btn" style="background:#7b1fa2" data-color="#7b1fa2"></div>
    </div>
    <label style="display:flex; align-items:center; gap:8px;">
      Свой цвет: <input type="color" id="customColor" value="#e91e63">
    </label>
  </div>
  <div class="hint">Сегментация ногтей. Цвет только по уверенной маске.</div>

  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>
  <script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const statusEl = document.getElementById('status');
    const startBtn = document.getElementById('start');
    const switchBtn = document.getElementById('switchCam');
    const colorBtns = document.querySelectorAll('.color-btn');
    const customColor = document.getElementById('customColor');

    let currentColor = '#e91e63';
    let session = null;
    let stream = null;
    let videoDevices = [];
    let useFront = false;
    let running = false;
    const MODEL_SIZE = 192;

    function setColor(color) {
      currentColor = color;
      colorBtns.forEach(b => b.classList.toggle('active', b.dataset.color === color));
    }
    colorBtns.forEach(btn => btn.addEventListener('click', () => setColor(btn.dataset.color)));
    customColor.addEventListener('input', e => setColor(e.target.value));
    setColor(currentColor);

    function hexToRgb(hex) {
      return {
        r: parseInt(hex.slice(1,3),16),
        g: parseInt(hex.slice(3,5),16),
        b: parseInt(hex.slice(5,7),16)
      };
    }

    async function loadModel() {
      statusEl.textContent = 'Загрузка U-Net модели...';
      try {
        session = await ort.InferenceSession.create('./nail_unet.onnx', {
          executionProviders: ['wasm']
        });
        statusEl.textContent = 'Модель загружена. Нажми кнопку.';
        startBtn.disabled = false;
      } catch (e) {
        console.error(e);
        statusEl.textContent = 'Ошибка загрузки модели: ' + e.message;
      }
    }

    async function getCameras() {
      try {
        const temp = await navigator.mediaDevices.getUserMedia({ video: true });
        temp.getTracks().forEach(t => t.stop());
        const devices = await navigator.mediaDevices.enumerateDevices();
        videoDevices = devices.filter(d => d.kind === 'videoinput');
      } catch (e) {}
    }

    function findDevice(preferFront) {
      if (!videoDevices.length) return null;
      const front = videoDevices.find(d => /front|user|face|лиц|selfie/i.test(d.label || ''));
      const rear = videoDevices.find(d => /back|rear|environment|задн|wide/i.test(d.label || ''));
      return preferFront ? (front || videoDevices[0]) : (rear || videoDevices[videoDevices.length - 1] || videoDevices[0]);
    }

    async function startCamera(preferFront = false) {
      startBtn.disabled = true;
      statusEl.textContent = 'Запуск камеры...';
      switchBtn.style.display = 'inline-block';
      useFront = preferFront;
      running = true;

      try {
        if (stream) stream.getTracks().forEach(t => t.stop());
        if (!videoDevices.length) await getCameras();

        const device = findDevice(preferFront);
        const constraints = {
          video: {
            width: { ideal: 1280 },
            height: { ideal: 720 },
            facingMode: preferFront ? 'user' : 'environment'
          }
        };
        if (device && device.deviceId) constraints.video.deviceId = { exact: device.deviceId };

        stream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = stream;
        await video.play();

        statusEl.textContent = preferFront ? 'Передняя камера' : 'Задняя камера';
        processLoop();
      } catch (err) {
        statusEl.textContent = 'Ошибка камеры: ' + err.message;
        startBtn.disabled = false;
        running = false;
      }
    }

    async function processLoop() {
      if (!running || !session) return;
      if (video.readyState >= 2) {
        await segmentAndDraw();
      }
      requestAnimationFrame(processLoop);
    }

    async function segmentAndDraw() {
      const w = video.videoWidth;
      const h = video.videoHeight;
      if (!w || !h) return;

      canvas.width = w;
      canvas.height = h;

      const tmp = document.createElement('canvas');
      tmp.width = MODEL_SIZE;
      tmp.height = MODEL_SIZE;
      const tctx = tmp.getContext('2d');
      tctx.drawImage(video, 0, 0, MODEL_SIZE, MODEL_SIZE);
      const imgData = tctx.getImageData(0, 0, MODEL_SIZE, MODEL_SIZE);

      const input = new Float32Array(MODEL_SIZE * MODEL_SIZE * 3);
      for (let i = 0; i < imgData.data.length; i += 4) {
        const idx = i / 4;
        input[idx] = imgData.data[i] / 255;
        input[idx + MODEL_SIZE * MODEL_SIZE] = imgData.data[i+1] / 255;
        input[idx + 2 * MODEL_SIZE * MODEL_SIZE] = imgData.data[i+2] / 255;
      }

      const tensor = new ort.Tensor('float32', input, [1, MODEL_SIZE, MODEL_SIZE, 3]);
      const feeds = { input: tensor };
      const results = await session.run(feeds);
      const mask = results[Object.keys(results)[0]].data;

      ctx.drawImage(video, 0, 0, w, h);

      const imageData = ctx.getImageData(0, 0, w, h);
      const scaleX = w / MODEL_SIZE;
      const scaleY = h / MODEL_SIZE;
      const rgb = hexToRgb(currentColor);
      const THRESHOLD = 0.55;

      for (let y = 0; y < MODEL_SIZE; y++) {
        for (let x = 0; x < MODEL_SIZE; x++) {
          const m = mask[y * MODEL_SIZE + x];
          if (m > THRESHOLD) {
            const px = Math.floor(x * scaleX);
            const py = Math.floor(y * scaleY);
            const strength = Math.min(1, (m - THRESHOLD) / 0.3);
            for (let dy = 0; dy < Math.ceil(scaleY) && py + dy < h; dy++) {
              for (let dx = 0; dx < Math.ceil(scaleX) && px + dx < w; dx++) {
                const i = ((py + dy) * w + (px + dx)) * 4;
                imageData.data[i]   = imageData.data[i]   * (1 - strength * 0.7) + rgb.r * strength * 0.7;
                imageData.data[i+1] = imageData.data[i+1] * (1 - strength * 0.7) + rgb.g * strength * 0.7;
                imageData.data[i+2] = imageData.data[i+2] * (1 - strength * 0.7) + rgb.b * strength * 0.7;
              }
            }
          }
        }
      }
      ctx.putImageData(imageData, 0, 0);
    }

    switchBtn.addEventListener('click', () => startCamera(!useFront));
    startBtn.addEventListener('click', () => startCamera(false));

    loadModel();
  </script>
</body>
</html>
