<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Nail AR</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #c8d0d8 0%, #e8eef2 35%, #f4f6f8 50%, #1a1a1a 50.1%, #0d0d0d 100%);
      background-attachment: fixed;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px 16px;
    }
    .main-screen, .camera-screen {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .camera-screen { display: none; }
    h1 {
      font-size: 2.2rem;
      font-weight: 700;
      margin-bottom: 8px;
      text-shadow: 0 4px 20px rgba(0,0,0,.5);
      letter-spacing: -0.5px;
    }
    .subtitle {
      font-size: 1rem;
      color: rgba(255,255,255,.7);
      margin-bottom: 40px;
      text-align: center;
    }
    .glass-btn {
      padding: 16px 48px;
      font-size: 1.1rem;
      font-weight: 600;
      border: none;
      border-radius: 24px;
      background: rgba(255,255,255,.18);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      color: #fff;
      cursor: pointer;
      box-shadow: 0 10px 40px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.4), inset 0 -1px 0 rgba(0,0,0,.2);
      border: 1px solid rgba(255,255,255,.3);
      transition: all .25s ease;
      text-shadow: 0 1px 3px rgba(0,0,0,.4);
    }
    .glass-btn:hover, .glass-btn:active {
      background: rgba(255,255,255,.28);
      transform: translateY(-2px);
      box-shadow: 0 16px 50px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.5);
    }
    .glass-btn.secondary {
      background: rgba(255,255,255,.08);
      padding: 12px 28px;
      font-size: 0.95rem;
      font-weight: 500;
    }
    .status {
      margin: 12px 0;
      font-size: 0.85rem;
      color: rgba(255,255,255,.7);
      text-align: center;
      min-height: 1.2em;
    }
    .container {
      position: relative;
      width: 100%;
      aspect-ratio: 3/4;
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,.5), 0 0 0 1px rgba(255,255,255,.15);
      margin-bottom: 16px;
    }
    video, canvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
    }
    canvas { pointer-events: none; }
    .controls {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: center;
    }
    .color-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .color-btn {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      transition: transform .15s ease;
      box-shadow: 0 6px 20px rgba(0,0,0,.35), inset 0 2px 4px rgba(255,255,255,.4);
    }
    .color-btn.active, .color-btn:hover {
      transform: scale(1.15);
      box-shadow: 0 8px 28px rgba(0,0,0,.45), 0 0 0 3px rgba(255,255,255,.5);
    }
    .back-btn { margin-top: 8px; }
    .finish-row {
      display: flex;
      gap: 8px;
      margin-top: 4px;
    }
    .finish-btn {
      padding: 6px 14px;
      font-size: 0.8rem;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,.3);
      background: rgba(255,255,255,.1);
      color: #fff;
      cursor: pointer;
    }
    .finish-btn.active {
      background: rgba(255,255,255,.3);
    }
  </style>
</head>
<body>
  <div class="main-screen" id="mainScreen">
    <h1>Nail AR</h1>
    <div class="subtitle">Примерка цвета ногтей<br>в реальном времени</div>
    <button class="glass-btn" id="openCamera">Открыть камеру</button>
  </div>

  <div class="camera-screen" id="cameraScreen">
    <div class="status" id="status">Загрузка...</div>
    <div class="container">
      <video id="video" autoplay playsinline muted></video>
      <canvas id="canvas"></canvas>
    </div>
    <div class="controls">
      <button id="switchCam" class="glass-btn secondary">Переключить камеру</button>
      <div class="color-row">
        <div class="color-btn" style="background:#e91e63" data-color="#e91e63"></div>
        <div class="color-btn" style="background:#d32f2f" data-color="#d32f2f"></div>
        <div class="color-btn" style="background:#212121" data-color="#212121"></div>
        <div class="color-btn" style="background:#ffffff" data-color="#ffffff"></div>
        <div class="color-btn" style="background:#ffc107" data-color="#ffc107"></div>
        <div class="color-btn" style="background:#7b1fa2" data-color="#7b1fa2"></div>
      </div>
      <div class="finish-row">
        <button class="finish-btn active" data-finish="gloss">Глянец</button>
        <button class="finish-btn" data-finish="matte">Мат</button>
        <button class="finish-btn" data-finish="sheer">Полупрозрачный</button>
      </div>
      <button id="backBtn" class="glass-btn secondary back-btn">Назад</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
  <script>
    const mainScreen = document.getElementById('mainScreen');
    const cameraScreen = document.getElementById('cameraScreen');
    const openCameraBtn = document.getElementById('openCamera');
    const backBtn = document.getElementById('backBtn');
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const statusEl = document.getElementById('status');
    const switchBtn = document.getElementById('switchCam');
    const colorBtns = document.querySelectorAll('.color-btn');
    const finishBtns = document.querySelectorAll('.finish-btn');

    let currentColor = '#e91e63';
    let currentFinish = 'gloss';
    let stream = null;
    let videoDevices = [];
    let useFront = false;
    let running = false;
    let hands = null;
    let lastLandmarks = null;
    let smoothed = null;

    const NAIL_PAIRS = [
      [8, 7],
      [12, 11],
      [16, 15],
      [20, 19],
      [4, 3]
    ];

    function setColor(color) {
      currentColor = color;
      colorBtns.forEach(b => b.classList.toggle('active', b.dataset.color === color));
    }
    colorBtns.forEach(btn => btn.addEventListener('click', () => setColor(btn.dataset.color)));
    setColor(currentColor);

    finishBtns.forEach(btn => btn.addEventListener('click', () => {
      currentFinish = btn.dataset.finish;
      finishBtns.forEach(b => b.classList.toggle('active', b === btn));
    }));

    function hexToRgb(hex) {
      return {
        r: parseInt(hex.slice(1,3),16),
        g: parseInt(hex.slice(3,5),16),
        b: parseInt(hex.slice(5,7),16)
      };
    }

    async function initHands() {
      statusEl.textContent = 'Загрузка MediaPipe...';
      hands = new Hands({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
      });
      hands.setOptions({
        maxNumHands: 1,
        modelComplexity: 1,
        minDetectionConfidence: 0.6,
        minTrackingConfidence: 0.5
      });
      hands.onResults(onResults);
      statusEl.textContent = 'Готово';
    }

    function onResults(results) {
      if (!running) return;
      const w = canvas.width;
      const h = canvas.height;
      if (!w || !h) return;

      ctx.drawImage(results.image, 0, 0, w, h);

      if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        const landmarks = results.multiHandLandmarks[0];
        lastLandmarks = landmarks;
        drawNails(landmarks, w, h);
        statusEl.textContent = 'Рука найдена';
      } else {
        statusEl.textContent = 'Покажи руку';
      }
    }

    function smoothLandmarks(landmarks) {
      if (!smoothed) {
        smoothed = landmarks.map(p => ({x: p.x, y: p.y, z: p.z}));
        return smoothed;
      }
      const a = 0.55;
      for (let i = 0; i < landmarks.length; i++) {
        smoothed[i].x = smoothed[i].x * (1-a) + landmarks[i].x * a;
        smoothed[i].y = smoothed[i].y * (1-a) + landmarks[i].y * a;
      }
      return smoothed;
    }

    function drawNails(landmarks, w, h) {
      const pts = smoothLandmarks(landmarks);
      const rgb = hexToRgb(currentColor);
      ctx.save();

      for (const [tip, dip] of NAIL_PAIRS) {
        const t = pts[tip];
        const d = pts[dip];
        const x = t.x * w;
        const y = t.y * h;
        const dx = (t.x - d.x) * w;
        const dy = (t.y - d.y) * h;
        const len = Math.sqrt(dx*dx + dy*dy) || 1;
        const angle = Math.atan2(dy, dx);

        const nailLen = len * 0.58;
        const nailWid = len * 0.42;

        const back = 0.15;
        const cx = x - dx * back;
        const cy = y - dy * back;

        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(angle);

        ctx.fillStyle = 'rgba(0,0,0,0.12)';
        ctx.beginPath();
        ctx.ellipse(nailLen*0.1, nailWid*0.15, nailLen*0.48, nailWid*0.42, 0, 0, Math.PI*2);
        ctx.fill();

        const g = ctx.createLinearGradient(-nailLen*0.2, -nailWid*0.3, nailLen*0.4, nailWid*0.3);
        const r = rgb.r, gC = rgb.g, b = rgb.b;
        if (currentFinish === 'gloss') {
          g.addColorStop(0, `rgba(${Math.max(0,r-30)},${Math.max(0,gC-30)},${Math.max(0,b-30)},0.82)`);
          g.addColorStop(0.35, `rgba(${r},${gC},${b},0.92)`);
          g.addColorStop(0.55, `rgba(${Math.min(255,r+50)},${Math.min(255,gC+50)},${Math.min(255,b+50)},0.95)`);
          g.addColorStop(1, `rgba(${Math.max(0,r-20)},${Math.max(0,gC-20)},${Math.max(0,b-20)},0.78)`);
        } else if (currentFinish === 'matte') {
          g.addColorStop(0, `rgba(${r},${gC},${b},0.88)`);
          g.addColorStop(1, `rgba(${Math.max(0,r-15)},${Math.max(0,gC-15)},${Math.max(0,b-15)},0.8)`);
        } else {
          g.addColorStop(0, `rgba(${r},${gC},${b},0.5)`);
          g.addColorStop(1, `rgba(${r},${gC},${b},0.35)`);
        }

        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.moveTo(-nailLen*0.35, 0);
        ctx.bezierCurveTo(-nailLen*0.25, -nailWid*0.55, nailLen*0.35, -nailWid*0.5, nailLen*0.55, 0);
        ctx.bezierCurveTo(nailLen*0.35, nailWid*0.5, -nailLen*0.25, nailWid*0.55, -nailLen*0.35, 0);
        ctx.closePath();
        ctx.fill();

        if (currentFinish === 'gloss') {
          ctx.strokeStyle = `rgba(255,255,255,0.35)`;
          ctx.lineWidth = Math.max(1, nailWid*0.06);
          ctx.beginPath();
          ctx.ellipse(nailLen*0.05, -nailWid*0.08, nailLen*0.28, nailWid*0.18, -0.3, 0, Math.PI*2);
          ctx.stroke();
        }

        ctx.restore();
      }
      ctx.restore();
    }

    async function getCameras() {
      try {
        const temp = await navigator.mediaDevices.getUserMedia({ video: true });
        temp.getTracks().forEach(t => t.stop());
        const devices = await navigator.mediaDevices.enumerateDevices();
        videoDevices = devices.filter(d => d.kind === 'videoinput');
      } catch (e) {}
    }

    function findDevice(preferFront) {
      if (!videoDevices.length) return null;
      const front = videoDevices.find(d => /front|user|face|лиц|selfie/i.test(d.label || ''));
      const rear = videoDevices.find(d => /back|rear|environment|задн|wide/i.test(d.label || ''));
      return preferFront ? (front || videoDevices[0]) : (rear || videoDevices[videoDevices.length - 1] || videoDevices[0]);
    }

    async function startCamera(preferFront = false) {
      statusEl.textContent = 'Запуск камеры...';
      useFront = preferFront;
      running = true;

      try {
        if (stream) stream.getTracks().forEach(t => t.stop());
        if (!videoDevices.length) await getCameras();

        const device = findDevice(preferFront);
        const constraints = {
          video: {
            width: { ideal: 1280 },
            height: { ideal: 720 },
            facingMode: preferFront ? 'user' : 'environment'
          }
        };
        if (device && device.deviceId) constraints.video.deviceId = { exact: device.deviceId };

        stream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = stream;
        await video.play();

        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;

        statusEl.textContent = preferFront ? 'Передняя камера' : 'Задняя камера';
        processLoop();
      } catch (err) {
        statusEl.textContent = 'Ошибка камеры';
        running = false;
      }
    }

    function stopCamera() {
      running = false;
      if (stream) {
        stream.getTracks().forEach(t => t.stop());
        stream = null;
      }
      video.srcObject = null;
    }

    async function processLoop() {
      if (!running || !hands) return;
      if (video.readyState >= 2) {
        await hands.send({ image: video });
      }
      requestAnimationFrame(processLoop);
    }

    openCameraBtn.addEventListener('click', async () => {
      mainScreen.style.display = 'none';
      cameraScreen.style.display = 'flex';
      if (!hands) await initHands();
      startCamera(false);
    });

    backBtn.addEventListener('click', () => {
      stopCamera();
      cameraScreen.style.display = 'none';
      mainScreen.style.display = 'flex';
    });

    switchBtn.addEventListener('click', () => startCamera(!useFront));

    initHands();
  </script>
</body>
</html>
